<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Claudia</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- From the home screen it runs full screen, its own background showing under the status bar (see --safe-top). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Claudia" />
    <!-- The page background, light and dark; a saved theme sets both to its own (theme.ts keeps them in step). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1c1f" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before the first paint, so a dark choice doesn't flash light.
      try {
        var theme = localStorage.getItem("claudia.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
          var colour = theme === "dark" ? "#1b1c1f" : "#ffffff";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", colour); });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
