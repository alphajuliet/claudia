name: Deploy

on:
  push:
    branches: [main]

env:
  # Not a secret: it identifies the account and appears in dashboard URLs.
  CLOUDFLARE_ACCOUNT_ID: 2c10ea8ac27c6a4de3dfb99aab9a727a

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A Time Travel bookmark from just before the migrations, to roll back to if one goes wrong (docs/backups.md).
      # Only the bookmark goes in the log: the repo is public, so no data leaves Cloudflare here.
      - name: Record a restore point
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bookmark=$(npx wrangler d1 time-travel info claudia --json | jq -r .bookmark)
          test -n "$bookmark" && test "$bookmark" != null
          echo "Restore point before migrations: $bookmark"
          {
            echo "### Restore point before migrations"
            echo '```'
            echo "npx wrangler d1 time-travel restore claudia --bookmark=$bookmark"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npx wrangler d1 migrations apply claudia --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
